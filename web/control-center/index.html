<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MENA MLOps Control Center</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">MENA MLOps</p>
        <h1>Control Center</h1>
      </div>
      <div class="topbar-actions">
        <span id="updated" class="muted">Loading...</span>
        <button id="refresh" class="button button-secondary">Refresh</button>
      </div>
    </header>

    <main class="shell">
      <section id="alerts"></section>
      <section id="summary" class="card-grid"></section>

      <nav class="tabs" aria-label="Dashboard sections">
        <button class="tab active" data-view="overview">Overview</button>
        <button class="tab" data-view="releases">Retraining & releases</button>
        <button class="tab" data-view="feedback">Feedback</button>
        <button class="tab" data-view="links">Specialist tools</button>
      </nav>

      <section id="view-overview" class="view"></section>
      <section id="view-releases" class="view hidden"></section>
      <section id="view-feedback" class="view hidden"></section>
      <section id="view-links" class="view hidden"></section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
