services:
  model-stable:
    build:
      context: .
      dockerfile: deploy/inference/Dockerfile
      args:
        ONNXRUNTIME_PACKAGE: ${ONNXRUNTIME_PACKAGE:-onnxruntime}
    environment:
      MODEL_BACKEND: ${STABLE_MODEL_BACKEND:-onnx}
      MODEL_PATH: /models/stable
      MODEL_ONNX_PATH: /models/stable/model-int8.onnx
      MODEL_TOKENIZER_PATH: /models/tokenizer
      MODEL_VERSION: ${STABLE_MODEL_VERSION:-onnx-int8-v1}
      MODEL_DEVICE: ${INFERENCE_DEVICE:-cpu}
      ONNX_PROVIDERS: ${ONNX_PROVIDERS:-}
      AUDIT_DB: /data/audit/predictions.db
      FEEDBACK_DB: /data/feedback/reviewed.db
    volumes:
      - ${STABLE_MODEL_PATH:-./models/arabert-debug-variants}:/models/stable:ro
      - ${MODEL_TOKENIZER_PATH:-./models/arabert-debug-variants}:/models/tokenizer:ro
      - ./data/audit:/data/audit
      - ./data/feedback:/data/feedback
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  model-candidate:
    build:
      context: .
      dockerfile: deploy/inference/Dockerfile
      args:
        ONNXRUNTIME_PACKAGE: ${ONNXRUNTIME_PACKAGE:-onnxruntime}
    environment:
      MODEL_BACKEND: ${CANDIDATE_MODEL_BACKEND:-onnx}
      MODEL_PATH: /models/candidate
      MODEL_ONNX_PATH: /models/candidate/${CANDIDATE_MODEL_FILE:-model-int8.onnx}
      MODEL_TOKENIZER_PATH: /models/tokenizer
      MODEL_VERSION: ${CANDIDATE_MODEL_VERSION:-candidate-v1}
      MODEL_DEVICE: ${INFERENCE_DEVICE:-cpu}
      ONNX_PROVIDERS: ${ONNX_PROVIDERS:-}
      AUDIT_DB: /data/audit/predictions.db
      FEEDBACK_DB: /data/feedback/reviewed.db
    volumes:
      - ${CANDIDATE_MODEL_PATH:-./models/arabert-debug-variants}:/models/candidate:ro
      - ${MODEL_TOKENIZER_PATH:-./models/arabert-debug-variants}:/models/tokenizer:ro
      - ./data/audit:/data/audit
      - ./data/feedback:/data/feedback
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      model-stable:
        condition: service_healthy
      model-candidate:
        condition: service_healthy
    environment:
      STABLE_WEIGHT: ${STABLE_WEIGHT:-95}
      CANDIDATE_WEIGHT: ${CANDIDATE_WEIGHT:-5}
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./deploy/nginx-entrypoint.sh:/docker-entrypoint-custom.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-custom.sh"]
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 5s
      retries: 6

  dashboard:
    build: .
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      MODEL_API_URL: http://nginx:8080
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://localhost:9090}
      MLFLOW_URL: ${MLFLOW_URL:-http://localhost:5000}
      AIRFLOW_URL: ${AIRFLOW_URL:-http://localhost:8081}
    ports:
      - "8501:8501"
    command:
      - streamlit
      - run
      - scripts/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501

  control-plane:
    build: .
    depends_on:
      nginx:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      prometheus:
        condition: service_started
    environment:
      MENA_PROJECT_ROOT: /opt/mena-mlops-project
      PYTHONPATH: /opt/mena-mlops-project/src
      CONTROL_PLANE_DB: /opt/mena-mlops-project/reports/control-plane/releases.db
      CONTROL_PLANE_STATIC_DIR: /opt/mena-mlops-project/web/control-center
      MODEL_API_URL: http://nginx:8080
      PROMETHEUS_URL: http://prometheus:9090
      MLFLOW_URL: http://mlflow:5000
      AIRFLOW_INTERNAL_URL: http://airflow:8080
      PROMETHEUS_PUBLIC_URL: http://localhost:9090
      MLFLOW_PUBLIC_URL: http://localhost:5000
      AIRFLOW_URL: http://localhost:8081
      GRAFANA_URL: http://localhost:3000
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-central1}
      FEEDBACK_URL: http://localhost:8503/reviewer
      FEEDBACK_DB: /opt/mena-mlops-project/data/feedback/reviewed.db
      AUDIT_DB: /opt/mena-mlops-project/data/audit/predictions.db
      FEEDBACK_CONFIG: /opt/mena-mlops-project/configs/feedback.yaml
    ports:
      - "8503:8503"
    volumes:
      - .:/opt/mena-mlops-project
    command:
      - uvicorn
      - mena_mlops.control_plane:app
      - --host=0.0.0.0
      - --port=8503

  mlflow:
    build:
      context: deploy/mlflow
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-key.json
    ports:
      - "5000:5000"
    volumes:
      - mlflow-backend:/mlflow
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/run/secrets/gcp-key.json:ro
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=${MLFLOW_ARTIFACT_LOCATION:-gs://mena-mlops-project-dvc/mlflow}
      - --serve-artifacts
      - --allowed-hosts=${MLFLOW_ALLOWED_HOSTS:-localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

  airflow:
    build:
      context: .
      dockerfile: deploy/airflow/Dockerfile
    depends_on:
      postgres-airflow:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres-airflow:5432/${AIRFLOW_DB_NAME:-airflow}
      MENA_DRIFT_SCHEDULE: "${MENA_DRIFT_SCHEDULE:-0 */6 * * *}"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-central1}
      VERTEX_MACHINE_TYPE: ${VERTEX_MACHINE_TYPE:-n1-standard-4}
      VERTEX_ACCELERATOR_TYPE: ${VERTEX_ACCELERATOR_TYPE:-NVIDIA_TESLA_T4}
      VERTEX_TRAINING_IMAGE_URI: ${VERTEX_TRAINING_IMAGE_URI:-}
      VERTEX_STAGING_BUCKET: ${VERTEX_STAGING_BUCKET:-gs://mena-mlops-project-dvc/vertex-staging}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_ARTIFACT_LOCATION: ${MLFLOW_ARTIFACT_LOCATION:-gs://mena-mlops-project-dvc/mlflow}
      MENA_AUTO_DEPLOY_PROJECT_ROOT: ${MENA_HOST_PROJECT_ROOT:-/home/az-wsl/projects/mena-mlops-project}
      DOCKER_COMPOSE_COMMAND: ${DOCKER_COMPOSE_COMMAND:-docker-compose}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/mena-gcp-key.json
    group_add:
      - "${DOCKER_GID:-1001}"
    volumes:
      - airflow-home:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker-compose:/usr/local/bin/docker-compose:ro
      - .:${MENA_HOST_PROJECT_ROOT:-/home/az-wsl/projects/mena-mlops-project}
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/mena-mlops-project/src:ro
      - ./scripts:/opt/mena-mlops-project/scripts:ro
      - ./configs:/opt/mena-mlops-project/configs:ro
      - ./reports:/opt/mena-mlops-project/reports
      - ./data:/opt/mena-mlops-project/data
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/run/secrets/gcp-key.json:ro
    entrypoint: ["/usr/local/bin/mena-airflow-entrypoint"]
    command: standalone
    healthcheck:
      test:
        - CMD
        - airflow
        - jobs
        - check
        - --job-type
        - SchedulerJob
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10

  feedback-consumer:
    build:
      context: .
      dockerfile: deploy/inference/Dockerfile
      args:
        ONNXRUNTIME_PACKAGE: ${ONNXRUNTIME_PACKAGE:-onnxruntime}
    depends_on:
      model-stable:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MODEL_BACKEND: ${STABLE_MODEL_BACKEND:-onnx}
      MODEL_PATH: /models/stable
      MODEL_ONNX_PATH: /models/stable/model-int8.onnx
      MODEL_TOKENIZER_PATH: /models/tokenizer
      MODEL_VERSION: ${STABLE_MODEL_VERSION:-onnx-int8-v1}
      MODEL_DEVICE: ${INFERENCE_DEVICE:-cpu}
      ONNX_PROVIDERS: ${ONNX_PROVIDERS:-}
      REDIS_URL: redis://redis:6379/0
      AUDIT_DB: /data/audit/predictions.db
      FEEDBACK_DB: /data/feedback/reviewed.db
      FEEDBACK_MIN_CONFIDENCE: ${FEEDBACK_MIN_CONFIDENCE:-0.25}
      FEEDBACK_MAX_CONFIDENCE: ${FEEDBACK_MAX_CONFIDENCE:-0.75}
    volumes:
      - ${STABLE_MODEL_PATH:-./models/arabert-debug-variants}:/models/stable:ro
      - ${MODEL_TOKENIZER_PATH:-./models/arabert-debug-variants}:/models/tokenizer:ro
      - ./data/feedback:/data/feedback
      - ./data/audit:/data/audit
    command:
      - python
      - scripts/run_stream_consumer.py
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      model-stable:
        condition: service_healthy
      model-candidate:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  airflow-home:
  airflow-postgres:
  mlflow-backend:
