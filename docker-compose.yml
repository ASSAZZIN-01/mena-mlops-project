services:
  model-stable:
    build: .
    environment:
      MODEL_BACKEND: ${STABLE_MODEL_BACKEND:-onnx}
      MODEL_PATH: /models/stable
      MODEL_ONNX_PATH: /models/stable/model-int8.onnx
      MODEL_TOKENIZER_PATH: /models/tokenizer
      MODEL_VERSION: ${STABLE_MODEL_VERSION:-onnx-int8-v1}
      MODEL_DEVICE: cpu
      AUDIT_DB: /data/audit/predictions.db
      FEEDBACK_DB: /data/feedback/reviewed.db
    volumes:
      - ${STABLE_MODEL_PATH:-./models/arabert-debug-variants}:/models/stable:ro
      - ${MODEL_TOKENIZER_PATH:-./models/arabert-debug-variants}:/models/tokenizer:ro
      - ./data/audit:/data/audit
      - ./data/feedback:/data/feedback
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  model-candidate:
    build: .
    environment:
      MODEL_BACKEND: ${CANDIDATE_MODEL_BACKEND:-onnx}
      MODEL_PATH: /models/candidate
      MODEL_ONNX_PATH: /models/candidate/model-int8.onnx
      MODEL_TOKENIZER_PATH: /models/tokenizer
      MODEL_VERSION: ${CANDIDATE_MODEL_VERSION:-candidate-v1}
      MODEL_DEVICE: cpu
      AUDIT_DB: /data/audit/predictions.db
      FEEDBACK_DB: /data/feedback/reviewed.db
    volumes:
      - ${CANDIDATE_MODEL_PATH:-./models/arabert-debug-variants}:/models/candidate:ro
      - ${MODEL_TOKENIZER_PATH:-./models/arabert-debug-variants}:/models/tokenizer:ro
      - ./data/audit:/data/audit
      - ./data/feedback:/data/feedback
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      model-stable:
        condition: service_healthy
      model-candidate:
        condition: service_healthy
    environment:
      STABLE_WEIGHT: ${STABLE_WEIGHT:-95}
      CANDIDATE_WEIGHT: ${CANDIDATE_WEIGHT:-5}
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./deploy/nginx-entrypoint.sh:/docker-entrypoint-custom.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-custom.sh"]

  dashboard:
    build: .
    depends_on:
      nginx:
        condition: service_started
    environment:
      MODEL_API_URL: http://nginx:8080
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://localhost:9090}
      MLFLOW_URL: ${MLFLOW_URL:-http://localhost:5000}
      AIRFLOW_URL: ${AIRFLOW_URL:-http://localhost:8081}
    ports:
      - "8501:8501"
    command:
      - streamlit
      - run
      - scripts/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501

  mlflow:
    build:
      context: deploy/mlflow
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-key.json
    ports:
      - "5000:5000"
    volumes:
      - mlflow-backend:/mlflow
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/run/secrets/gcp-key.json:ro
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=${MLFLOW_ARTIFACT_LOCATION:-gs://mena-mlops-project-dvc/mlflow}
      - --serve-artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

  airflow:
    build:
      context: .
      dockerfile: deploy/airflow/Dockerfile
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      MENA_DRIFT_SCHEDULE: "${MENA_DRIFT_SCHEDULE:-*/10 * * * *}"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    volumes:
      - airflow-home:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/mena-mlops-project/src:ro
      - ./scripts:/opt/mena-mlops-project/scripts:ro
      - ./reports:/opt/mena-mlops-project/reports
      - ./data:/opt/mena-mlops-project/data
    entrypoint: ["/usr/local/bin/mena-airflow-entrypoint"]
    command: standalone
    healthcheck:
      test:
        - CMD
        - airflow
        - jobs
        - check
        - --job-type
        - SchedulerJob
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10

  feedback-ui:
    build: .
    depends_on:
      feedback-consumer:
        condition: service_started
    environment:
      FEEDBACK_DB: /data/feedback/reviewed.db
    ports:
      - "8502:8501"
    volumes:
      - ./data/feedback:/data/feedback
    command:
      - streamlit
      - run
      - scripts/feedback_ui.py
      - --server.address=0.0.0.0
      - --server.port=8501

  feedback-consumer:
    build: .
    depends_on:
      model-stable:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MODEL_BACKEND: ${STABLE_MODEL_BACKEND:-onnx}
      MODEL_PATH: /models/stable
      MODEL_ONNX_PATH: /models/stable/model-int8.onnx
      MODEL_TOKENIZER_PATH: /models/tokenizer
      MODEL_VERSION: ${STABLE_MODEL_VERSION:-onnx-int8-v1}
      MODEL_DEVICE: cpu
      REDIS_URL: redis://redis:6379/0
      AUDIT_DB: /data/audit/predictions.db
      FEEDBACK_DB: /data/feedback/reviewed.db
      FEEDBACK_MIN_CONFIDENCE: ${FEEDBACK_MIN_CONFIDENCE:-0.25}
      FEEDBACK_MAX_CONFIDENCE: ${FEEDBACK_MAX_CONFIDENCE:-0.75}
    volumes:
      - ${STABLE_MODEL_PATH:-./models/arabert-debug-variants}:/models/stable:ro
      - ${MODEL_TOKENIZER_PATH:-./models/arabert-debug-variants}:/models/tokenizer:ro
      - ./data/feedback:/data/feedback
      - ./data/audit:/data/audit
    command:
      - uv
      - run
      - --no-sync
      - python
      - scripts/run_stream_consumer.py
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      model-stable:
        condition: service_healthy
      model-candidate:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  airflow-home:
  mlflow-backend:
