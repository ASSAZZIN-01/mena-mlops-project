[project]
name = "mena-mlops-project"
version = "0.1.0"
description = "MENA MLOps course project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MENA MLOps Project Contributors" }]
dependencies = [
    "datasets>=3.0",
    "kaggle>=1.6",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "dvc>=3.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
