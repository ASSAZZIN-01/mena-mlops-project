[project]
name = "mena-mlops-project"
version = "0.1.0"
description = "MENA MLOps course project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MENA MLOps Project Contributors" }]
dependencies = [
    "accelerate>=1.0",
    "bentoml>=1.4",
    "datasets>=3.0",
    "evidently>=0.7",
    "fastapi>=0.142.2",
    "google-cloud-storage>=2.18",
    "kaggle>=1.6",
    "mlflow>=2.16",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pandas>=2.2",
    "prometheus-client>=0.26.0",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
    "torch==2.5.1",
    "transformers>=4.45",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "dvc[gs]>=3.0",
    "httpx>=0.28.1",
    "locust>=2.45",
    "onnx>=1.16",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
